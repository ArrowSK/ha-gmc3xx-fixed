name: Finalize privacy history rewrite

on:
  push:

permissions:
  actions: write
  contents: write

jobs:
  finalize:
    if: ${{ github.event.head_commit.message == 'Trigger privacy finalizer' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out sanitized main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Delete stale workflow-run references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in $(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '.workflow_runs[].id'); do
            if [[ "${run_id}" != "${GITHUB_RUN_ID}" ]]; then
              gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" || true
            fi
          done

      - name: Remove one-time finalizer and trigger marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/privacy-finalize.yml
          git rm -f .privacy-finalizer-trigger || true
          git commit -m "Complete privacy history cleanup"
          git push origin HEAD:main
