name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python3 -m pip install --disable-pip-version-check pyyaml

      - name: Validate YAML and app configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          paths = [Path('repository.yaml'), Path('gmc3xx_fixed/config.yaml'), Path('gmc3xx_fixed/translations/en.yaml')]
          docs = {}
          for path in paths:
              with path.open('r', encoding='utf-8') as handle:
                  docs[path] = yaml.safe_load(handle)
              print(f'validated {path}')

          config = docs[Path('gmc3xx_fixed/config.yaml')]
          assert config['slug'] == 'gmc3xx_fixed'
          assert config['version'] == '1.1.1'
          assert config['arch'] == ['aarch64', 'amd64']
          assert config['init'] is False
          assert config['uart'] is True
          assert config['host_network'] is True
          assert config['options']['mqtt_password'] == ''
          assert config['options']['mqtt_user'] == ''
          assert config['options']['port'] == '/dev/ttyUSB0'
          assert config['options']['baud'] == 'auto'
          PY

      - name: Public repository privacy check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          allowed_synthetic_hex = {'ab0c012304def0'}
          email = re.compile(r'(?i)\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b')
          private_ip = re.compile(r'\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b')
          hex_identifier = re.compile(r'(?i)(?<![0-9a-f])[0-9a-f]{12,16}(?![0-9a-f])')

          failures = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if email.search(text):
                  failures.append(f'{path}: email-like address present')
              if private_ip.search(text):
                  failures.append(f'{path}: private IPv4 address present')
              for match in hex_identifier.finditer(text):
                  value = match.group(0).lower()
                  if value not in allowed_synthetic_hex:
                      failures.append(f'{path}: device-identifier-like hexadecimal value present')

          if failures:
              print('\n'.join(failures), file=sys.stderr)
              raise SystemExit(1)
          print('privacy checks passed')
          PY

      - name: Validate shell
        run: |
          bash -n gmc3xx_fixed/run.sh
          shellcheck --shell=bash gmc3xx_fixed/run.sh

      - name: Build serial reader with warnings as errors
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -O2 \
            gmc3xx_fixed/src/gmc320.c -o gmc320-test

      - name: Run fragmented-serial regression tests
        env:
          GMC320_BINARY: ./gmc320-test
        run: python3 tests/test_protocol.py

      - name: Build Home Assistant app image
        run: |
          docker build \
            --build-arg BUILD_VERSION=1.1.1 \
            --build-arg BUILD_ARCH=amd64 \
            --tag gmc3xx-fixed:test \
            gmc3xx_fixed
