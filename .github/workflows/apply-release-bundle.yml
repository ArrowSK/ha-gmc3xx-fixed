name: Apply release bundle

on:
  push:
    branches:
      - release-1.2.0

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release-1.2.0
          fetch-depth: 1

      - name: Apply release files
        run: |
          if [ ! -f .release/chunk00 ]; then
            echo "Release bundle already applied"
            exit 0
          fi

          cat .release/chunk* > /tmp/gmc-v1.2.0-text.tgz
          echo "86d08c44c9a0ee4d61aff17d43ca80833445f18365be1e4b18f15e935c70f5ad  /tmp/gmc-v1.2.0-text.tgz" | sha256sum -c -
          tar -xzf /tmp/gmc-v1.2.0-text.tgz -C .
          rm -rf .release
          chmod 0755 gmc3xx_fixed/run.sh

          git config user.name "github-actions[bot]"
          git config user.email "actions"
          git add -A
          git commit -m "Release GMC3xx Radiation Monitor 1.2.0"
          git push origin HEAD:release-1.2.0
