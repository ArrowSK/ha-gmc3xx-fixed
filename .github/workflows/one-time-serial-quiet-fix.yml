name: One-time serial quiescence fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply targeted 1.1.2 patch
        run: |
          if grep -q 'version: "1.1.2"' gmc3xx_fixed/config.yaml; then
            echo "1.1.2 patch already applied"
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('gmc3xx_fixed/src/gmc320.c')
          source = source_path.read_text()
          old = "    if (tcdrain(fd) != 0) {\n        return -1;\n    }\n    usleep(50000);\n    return flush_input(fd);\n"
          new = "    if (tcdrain(fd) != 0) {\n        return -1;\n    }\n    /* Match the effective quiet period of the upstream VTIME=5 drain.\n     * GMC-300-series firmware can ignore the first polling command if it\n     * follows HEARTBEAT0 too quickly. Wait 500 ms, then discard any bytes\n     * that were already in flight before starting a framed transaction. */\n    usleep(500000);\n    return flush_input(fd);\n"
          if source.count(old) != 1:
              raise SystemExit(f'expected heartbeat settle block once, found {source.count(old)}')
          source_path.write_text(source.replace(old, new, 1))

          test_path = Path('tests/test_protocol.py')
          tests = test_path.read_text()
          old = "                if expected == HEARTBEAT:\n                    continue\n"
          new = "                if expected == HEARTBEAT:\n                    # Simulate stale bytes already in flight when HEARTBEAT0\n                    # is accepted. They must be drained before GETCPM.\n                    time.sleep(0.10)\n                    os.write(master_fd, bytes([0x34, 0x2E]))\n                    continue\n"
          if tests.count(old) != 1:
              raise SystemExit(f'expected heartbeat simulator block once, found {tests.count(old)}')
          test_path.write_text(tests.replace(old, new, 1))

          config_path = Path('gmc3xx_fixed/config.yaml')
          config = config_path.read_text()
          if config.count('version: "1.1.1"') != 1:
              raise SystemExit('expected config version 1.1.1 exactly once')
          config_path.write_text(config.replace('version: "1.1.1"', 'version: "1.1.2"', 1))

          changelog_path = Path('gmc3xx_fixed/CHANGELOG.md')
          changelog = changelog_path.read_text()
          header = '# Changelog\n\n'
          if not changelog.startswith(header):
              raise SystemExit('unexpected changelog header')
          section = (
              '## 1.1.2 — 2026-08-12\n\n'
              '- Restored the effective 500 ms post-`HEARTBEAT0` quiet period used by the upstream reader before the first polling command.\n'
              '- This targets GMC-300-series firmware that can otherwise ignore the first `GETCPM` immediately after opening the port and disabling heartbeat.\n'
              '- Added a pseudo-terminal regression condition with deliberately delayed stale bytes after `HEARTBEAT0`; those bytes must be discarded and must never become a false CPM value.\n'
              '- No numerical CPM ceiling or spike filter was added.\n\n'
          )
          changelog_path.write_text(header + section + changelog[len(header):])
          PY

          grep -q 'version: "1.1.2"' gmc3xx_fixed/config.yaml
          grep -q 'usleep(500000)' gmc3xx_fixed/src/gmc320.c
          grep -q 'bytes(\[0x34, 0x2E\])' tests/test_protocol.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gmc3xx_fixed/src/gmc320.c tests/test_protocol.py gmc3xx_fixed/config.yaml gmc3xx_fixed/CHANGELOG.md
          git commit -m "Fix GMC-300 post-heartbeat serial timing"
          git push origin HEAD:main
