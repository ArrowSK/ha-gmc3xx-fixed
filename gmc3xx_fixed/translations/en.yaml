configuration:
  port:
    name: Serial device
    description: Use auto to find one compatible GMC counter, or enter a specific path such as /dev/ttyUSB0 or a /dev/serial/by-id path.
  baud:
    name: Serial baud rate
    description: Leave this on auto unless you already know the counter's baud rate. A numeric value such as 19200 can be used when needed.
  mqtt_server:
    name: MQTT server override
    description: Leave blank to use Home Assistant's MQTT service automatically. Fill this only when you want to use a different broker.
  mqtt_port:
    name: MQTT port
    description: Port used only with a manually configured MQTT server.
  mqtt_user:
    name: MQTT username
    description: Username used only with a manually configured MQTT server.
  mqtt_password:
    name: MQTT password
    description: Password used only with a manually configured MQTT server. It is never printed in the app log.
  repeat:
    name: Polling interval
    description: Seconds between readings. Five seconds is a good default for normal Home Assistant use.
