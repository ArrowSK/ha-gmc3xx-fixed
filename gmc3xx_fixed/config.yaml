name: "GMC3xx Fixed Radiation Monitor"
description: "Robust serial-to-MQTT bridge for GQ GMC counters using the legacy RFC1201 protocol"
version: "1.1.2"
slug: "gmc3xx_fixed"
url: "https://github.com/ArrowSK/ha-gmc3xx-fixed"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
uart: true
host_network: true
options:
  port: "/dev/ttyUSB0"
  baud: "auto"
  mqtt_server: "localhost"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  repeat: 60
schema:
  port: "device(subsystem=tty)"
  baud: str
  mqtt_server: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  repeat: "int(2,3600)"
