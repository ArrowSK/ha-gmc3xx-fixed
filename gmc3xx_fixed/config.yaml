name: "GMC3xx Radiation Monitor"
description: "Reads supported GQ GMC Geiger counters over USB and sends their measurements to MQTT"
version: "1.2.0"
slug: "gmc3xx_fixed"
url: "https://github.com/ArrowSK/ha-gmc3xx-fixed"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
stage: stable
init: false
uart: true
host_network: true
services:
  - mqtt:want
watchdog: "tcp://[HOST]:38121"
options:
  port: "auto"
  baud: "auto"
  mqtt_server: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  repeat: 5
schema:
  port: str
  baud: str
  mqtt_server: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  repeat: "int(2,3600)"
